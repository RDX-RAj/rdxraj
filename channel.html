<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>EDITOR RAJ — Channel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="channel.css">
  <script defer src="channel.js"></script>
</head>
<body>
  <main class="channel-shell">
    <header class="mobile-topbar">
      <button class="icon-btn" type="button" aria-label="Back">←</button>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" aria-label="Search">⌕</button>
        <button class="icon-btn" type="button" aria-label="More">⋮</button>
      </div>
    </header>

    <section class="subscribe-banner" aria-label="Subscriber goal">
      <div class="subscribe-title">SUBSCRIBE NOW !</div>
      <div class="progress-row">
        <span class="progress-pill progress-main">90K</span>
        <span class="progress-pill">100K</span>
      </div>
    </section>

    <section class="profile-block">
      <div class="profile-row">
        <img class="avatar" src="1762319150601.jpg" alt="Editor Raj profile photo">
        <div class="profile-copy">
          <h1>EDITOR RAJ</h1>
          <a class="handle" href="https://www.youtube.com/channel/UCXBXbRGKFvyH83jjgCVD2gQ" target="_blank" rel="noopener">@theeditorraj</a>
          <div class="channel-stats"><strong>72.5K</strong> subscribers</div>
        </div>
      </div>

      <p class="channel-bio">HELLO FRIENDS 👋 ...more</p>
      <p class="channel-links">↗ rdx-raj.github.io/theeditorraj and 1 more link</p>

      <div class="owner-actions">
        <a class="action-btn" href="https://studio.youtube.com" target="_blank" rel="noopener">▣ Analytics</a>
        <a class="action-btn" href="https://studio.youtube.com/channel/UCXBXbRGKFvyH83jjgCVD2gQ/editing" target="_blank" rel="noopener">✎ Edit Channel</a>
      </div>

      <a class="community-btn" href="https://www.youtube.com/channel/UCXBXbRGKFvyH83jjgCVD2gQ/community" target="_blank" rel="noopener">♧ Community</a>
    </section>

    <nav class="channel-tabs" aria-label="Channel sections">
      <button class="tab active" data-target="home">Home</button>
      <button class="tab" data-target="videos">Videos</button>
      <button class="tab" data-target="shorts">Shorts</button>
      <button class="tab" data-target="live">Live</button>
      <button class="tab" data-target="posts">Posts</button>
    </nav>

    <section class="tab-preview" id="home">
      <div class="section-head"><h2>Popular videos</h2></div>
      <div class="empty-preview">
        <span>Popular video cards will be added here next.</span>
      </div>
    </section>
  </main>
</body>
</html>
